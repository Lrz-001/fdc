<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>二手电动车自助选车</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚲</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#f4f7f5;--fg:#1e293b;--card:#fff;--primary:#2d7a5f;--primary-fg:#fff;
  --secondary:#e2efe8;--secondary-fg:#1f5e47;--muted:#64748b;--border:#e2e8e5;
  --price:#e85d2a;--destructive:#ef4444;--success:#16a34a;--info:#3b82f6;
  --radius:8px;--font:'Noto Sans SC',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased;padding-bottom:64px}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:14px}

/* 通用按钮 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:var(--radius);font-size:14px;font-weight:500;border:1px solid transparent;transition:all .15s;white-space:nowrap;padding:0 12px;height:36px}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{filter:brightness(.93)}
.btn-secondary{background:var(--secondary);color:var(--secondary-fg)}
.btn-secondary:hover{background:#d4e7dc}
.btn-destructive{background:var(--destructive);color:#fff}
.btn-price{background:var(--price);color:#fff}
.btn-price:hover{filter:brightness(.92)}
.btn-ghost{background:transparent;color:var(--fg)}
.btn-ghost:hover{background:var(--secondary)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--fg)}
.btn-sm{height:32px;padding:0 10px;font-size:13px}
.btn-lg{height:44px;padding:0 18px;font-size:15px}
.btn-icon{width:36px;height:36px;padding:0;border-radius:50%}
.btn-block{width:100%}

/* 输入框 */
.input,.select,.textarea{width:100%;height:38px;padding:0 12px;border-radius:var(--radius);border:1px solid var(--border);background:#fafbfb;color:var(--fg);outline:none;transition:border-color .15s,box-shadow .15s}
.input:focus,.select:focus,.textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(45,122,95,.12)}
.textarea{height:auto;padding:8px 12px;resize:vertical;line-height:1.5}
.label{display:block;font-size:12px;font-weight:500;margin-bottom:6px;color:var(--fg)}
.select-wrap{position:relative}
.select-wrap::after{content:'';position:absolute;right:12px;top:50%;width:6px;height:6px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}

/* 徽章 */
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:500;border:1px solid transparent}
.badge-default{background:var(--primary);color:#fff}
.badge-secondary{background:var(--secondary);color:var(--secondary-fg)}
.badge-outline{background:transparent;border:1px solid var(--border);color:var(--fg)}
.badge-success{background:var(--success);color:#fff}
.badge-info{background:var(--info);color:#fff}
.badge-click{cursor:pointer;transition:all .15s}
.badge-click:hover{background:rgba(45,122,95,.1)}

/* 卡片 */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.04)}

/* 开关 */
.switch{position:relative;width:40px;height:22px;border-radius:999px;background:#cbd5d1;cursor:pointer;transition:background .2s;flex-shrink:0}
.switch.on{background:var(--primary)}
.switch-dot{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.switch.on .switch-dot{transform:translateX(18px)}

/* 滑块 */
.slider{-webkit-appearance:none;appearance:none;width:100%;height:4px;background:#e2e8e5;border-radius:999px;outline:none}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--primary);cursor:pointer;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.slider::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--primary);cursor:pointer;border:2px solid #fff}

/* 弹窗 */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;animation:fadeIn .2s}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.15);z-index:101;max-width:90vw;max-height:90vh;overflow-y:auto;animation:modalIn .2s;width:100%}
@media(min-width:480px){.modal{max-width:420px}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes modalIn{from{opacity:0;transform:translate(-50%,-48%) scale(.98)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}

/* Toast */
.toast-wrap{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{padding:10px 16px;border-radius:8px;background:#1e293b;color:#fff;font-size:14px;box-shadow:0 4px 12px rgba(0,0,0,.15);animation:toastIn .3s;pointer-events:auto;max-width:90vw}
.toast-success{background:var(--success);color:#fff}
.toast-error{background:var(--destructive);color:#fff}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}

/* 底部导航 */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:50;border-top:1px solid rgba(226,232,229,.6);background:rgba(255,255,255,.95);backdrop-filter:blur(12px);padding-bottom:env(safe-area-inset-bottom)}
.tabbar-inner{max-width:448px;margin:0 auto;display:flex;padding:0 8px}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;color:var(--muted);transition:color .2s;font-size:11px;font-weight:500}
.tab-item.active{color:var(--primary)}
.tab-item svg{width:22px;height:22px}

/* 页面容器 */
.page{min-height:100vh}
.container{max-width:448px;margin:0 auto;padding:0 16px}
.header{position:sticky;top:0;z-index:40;background:linear-gradient(to bottom,rgba(45,122,95,.08),rgba(255,255,255,.95),rgba(255,255,255,.8));backdrop-filter:blur(12px);border-bottom:1px solid rgba(226,232,229,.3)}
.header-plain{background:rgba(255,255,255,.95)}

/* 车辆卡片 */
.vcard{border-radius:12px;border:1px solid rgba(226,232,229,.6);background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.04);transition:box-shadow .2s,transform .2s;cursor:pointer;overflow:hidden}
.vcard:hover{box-shadow:0 4px 12px rgba(0,0,0,.08)}
.vcard:active{transform:scale(.99)}
.vcard-img{position:relative;aspect-ratio:4/3;width:100%;overflow:hidden;background:rgba(226,232,229,.5)}
.vcard-img img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.vcard:hover .vcard-img img{transform:scale(1.05)}
.vcard-img .placeholder{display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);opacity:.4}
.fav-btn{position:absolute;right:8px;top:8px;z-index:10;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.15);transition:all .15s;background:var(--secondary);color:var(--muted)}
.fav-btn.on{background:var(--primary);color:#fff}
.fav-btn.on svg{fill:currentColor}
.badge-3c{position:absolute;left:8px;top:8px;display:flex;align-items:center;gap:3px;padding:2px 8px;border-radius:6px;background:rgba(22,163,74,.9);color:#fff;font-size:12px;font-weight:500;z-index:5}
.vcard-body{padding:12px}
.vcard-title{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vcard-price{display:flex;align-items:baseline;gap:2px;margin-top:4px}
.vcard-price .yuan{font-size:12px;color:var(--muted)}
.vcard-price .num{font-size:24px;color:var(--price);font-weight:700;font-variant-numeric:tabular-nums}
.vcard-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.vcard-desc{font-size:12px;color:var(--muted);margin-top:6px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}

/* 筛选面板 */
.filter-panel{overflow:hidden;transition:max-height .3s,opacity .25s}
.filter-panel.collapsed{max-height:0;opacity:0}
.filter-panel.expanded{max-height:2000px;opacity:1;margin-bottom:12px}
.filter-box{padding:16px;border-radius:12px;border:1px solid var(--border);background:#fff}
.filter-row{margin-bottom:16px}
.filter-row:last-child{margin-bottom:0}
.filter-tags{display:flex;flex-wrap:wrap;gap:6px}

/* 空状态 */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:64px 16px;text-align:center}
.empty-icon{margin-bottom:16px;border-radius:50%;background:rgba(226,232,229,.5);padding:24px;color:rgba(100,116,139,.4)}
.empty-icon svg{width:48px;height:48px;stroke-width:1.2}

/* 底部提示 */
.footer-tip{width:100%;padding:12px 16px;text-align:center;font-size:11px;color:rgba(100,116,139,.7);line-height:1.6}

/* 后台列表 */
.admin-item{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid rgba(226,232,229,.6)}
.admin-item:last-child{border-bottom:none}
.admin-thumb{width:56px;height:56px;border-radius:8px;overflow:hidden;background:rgba(226,232,229,.5);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.admin-thumb img{width:100%;height:100%;object-fit:cover}
.admin-info{flex:1;min-width:0}
.admin-name{font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.admin-price{font-size:14px;color:var(--price);font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.admin-actions{display:flex;gap:4px;flex-shrink:0}

/* 手风琴 */
.accordion{border-bottom:1px solid var(--border)}
.accordion:last-child{border-bottom:none}
.accordion-head{display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px 0;font-size:14px;font-weight:600;color:var(--fg)}
.accordion-chevron{transition:transform .2s}
.accordion.open .accordion-chevron{transform:rotate(180deg)}
.accordion-body{overflow:hidden;transition:max-height .25s}

/* 网格 */
.grid{display:grid;gap:12px}
.grid-2{grid-template-columns:repeat(2,1fr)}
@media(min-width:480px){.grid-2{grid-template-columns:repeat(2,1fr)}}

/* 详情弹窗 */
.detail-img{position:relative;aspect-ratio:4/3;width:100%;overflow:hidden;background:rgba(226,232,229,.5)}
.detail-img img{width:100%;height:100%;object-fit:cover}
.detail-close{position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.4);color:#fff;display:flex;align-items:center;justify-content:center;z-index:10}
.detail-body{padding:20px}
.detail-price-num{font-size:30px;color:var(--price);font-weight:700}
.detail-params{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:16px;border-radius:12px;border:1px solid var(--border);background:rgba(226,232,229,.3)}
.detail-param{display:flex;align-items:center;gap:8px;font-size:13px}
.detail-param .lbl{color:var(--muted)}
.detail-param .val{font-weight:500}
.detail-section{margin-top:16px}
.detail-section h3{font-size:13px;font-weight:600;margin-bottom:8px}
.detail-desc{font-size:13px;line-height:1.6;color:var(--muted);white-space:pre-line}
.merchant-box{padding:16px;border-radius:12px;border:1px solid var(--border);background:#fff}
.contact-box{padding:16px;border-radius:12px;border:1px solid rgba(45,122,95,.3);background:rgba(45,122,95,.05);margin-top:12px}
.contact-tip{text-align:center;font-size:13px;font-weight:500;color:var(--primary);margin-bottom:12px}
.contact-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:40px;border-radius:8px;font-size:14px;font-weight:600;color:#fff;background:var(--primary);margin-bottom:8px}
.contact-btn.secondary{background:var(--secondary);color:var(--secondary-fg)}

/* 二维码弹窗 */
.qr-box{display:flex;flex-direction:column;align-items:center;padding:8px}
.qr-code{border:4px solid rgba(45,122,95,.1);border-radius:12px;padding:12px;background:#fff}
.qr-url{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin-top:8px;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 登录页 */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:80vh;padding:24px}
.login-box{width:100%;max-width:320px;text-align:center}
.login-icon{width:64px;height:64px;border-radius:16px;background:rgba(45,122,95,.1);color:var(--primary);display:flex;align-items:center;justify-content:center;margin:0 auto 24px}
.login-title{font-size:20px;font-weight:700;margin-bottom:4px}
.login-sub{font-size:14px;color:var(--muted);margin-bottom:24px}
.login-pwd-wrap{position:relative;margin-bottom:16px}
.login-pwd-wrap .input{height:48px;padding-right:40px;font-size:16px}
.login-eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);display:flex}
.login-hint{font-size:11px;color:rgba(100,116,139,.7);margin-top:16px}

/* 工具类 */
.flex{display:flex}.items-center{align-items:center}.justify-between{justify-content:space-between}.justify-center{justify-content:center}
.flex-col{flex-direction:column}.flex-1{flex:1}.gap-1{gap:4px}.gap-2{gap:8px}.gap-3{gap:12px}.gap-4{gap:16px}
.mt-1{margin-top:4px}.mt-2{margin-top:8px}.mt-3{margin-top:12px}.mt-4{margin-top:16px}
.mb-1{margin-bottom:4px}.mb-2{margin-bottom:8px}.mb-3{margin-bottom:12px}.mb-4{margin-bottom:16px}
.py-2{padding-top:8px;padding-bottom:8px}.py-3{padding-top:12px;padding-bottom:12px}.py-4{padding-top:16px;padding-bottom:16px}
.px-4{padding-left:16px;padding-right:16px}.p-4{padding:16px}.p-5{padding:20px}
.text-xs{font-size:12px}.text-sm{font-size:14px}.text-base{font-size:16px}.text-lg{font-size:18px}.text-xl{font-size:20px}
.font-medium{font-weight:500}.font-semibold{font-weight:600}.font-bold{font-weight:700}
.text-muted{color:var(--muted)}.text-primary{color:var(--primary)}.text-price{color:var(--price)}.text-destructive{color:var(--destructive)}
.truncate{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabular{font-variant-numeric:tabular-nums}
.hidden{display:none!important}
.divide-y>*+*{border-top:1px solid rgba(226,232,229,.6)}
</style>
</head>

// ========== Toast ==========
let toastSeq=0;
function toast(msg,type){
  const id=++toastSeq;
  const wrap=$('#toastWrap');
  const t=el('div',{class:'toast toast-'+(type||'default')},msg);
  wrap.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300);},2200);
}
const Toast={success:m=>toast(m,'success'),error:m=>toast(m,'error'),info:m=>toast(m,'default')};

// ========== 弹窗 ==========
function showModal(content){
  closeModal();
  const mask=el('div',{class:'modal-mask',onclick:e=>{if(e.target===mask)closeModal();}});
  const modal=el('div',{class:'modal'},content);
  document.body.appendChild(mask);document.body.appendChild(modal);
  state.modal={mask,modal};
}
function closeModal(){
  if(state.modal){state.modal.mask.remove();state.modal.modal.remove();state.modal=null;}
}

// ========== 渲染入口 ==========
function render(){
  const app=$('#app');
  app.innerHTML='';
  if(state.tab==='browse')app.appendChild(renderBrowse());
  else if(state.tab==='favorites')app.appendChild(renderFavorites());
  else if(state.tab==='admin')app.appendChild(renderAdmin());
  app.appendChild(renderTabBar());
}

function setTab(t){state.tab=t;window.scrollTo(0,0);render();}

// ========== 底部导航 ==========

function renderVehicleCard(v){
  const isFav=state.favorites.includes(v.id);
  const card=el('div',{class:'vcard',onclick:()=>showVehicleDetail(v)});
  // 图片
  const imgWrap=el('div',{class:'vcard-img'});
  if(v.image){imgWrap.appendChild(el('img',{src:v.image,alt:v.brand+' '+v.model}));}
  else{imgWrap.appendChild(el('div',{class:'placeholder'},svgIcon('bike','64px')));}
  // 收藏按钮
  const favBtn=el('button',{class:'fav-btn'+(isFav?' on':''),onclick:e=>{e.stopPropagation();toggleFav(v.id);}},[svgIcon('heart','16px')]);
  imgWrap.appendChild(favBtn);
  // 3C标
  if(v.has3C){imgWrap.appendChild(el('div',{class:'badge-3c'},[svgIcon('shield','12px'),' 3C认证']));}
  card.appendChild(imgWrap);
  // 内容
  const body=el('div',{class:'vcard-body'});
  body.appendChild(el('div',{class:'vcard-title'},v.brand+' '+v.model));
  const price=el('div',{class:'vcard-price'},[el('span',{class:'yuan'},'￥'),el('span',{class:'num'},v.price.toLocaleString())]);
  body.appendChild(price);
  const tags=el('div',{class:'vcard-tags'});
  [v.condition,'续航'+v.range+'km',v.voltage,v.years].forEach(t=>tags.appendChild(el('span',{class:'badge badge-outline'},t)));
  body.appendChild(tags);
  if(v.description)body.appendChild(el('div',{class:'vcard-desc'},v.description));
  card.appendChild(body);
  return card;
}

function toggleFav(id){
  const idx=state.favorites.indexOf(id);
  if(idx>=0){state.favorites.splice(idx,1);Toast.success('已取消收藏');}
  else{state.favorites.push(id);Toast.success('已加入收藏');}
  saveFavorites();render();
}

  if(m.bio)mbox.appendChild(el('p',{class:'text-xs text-muted mt-1'},m.bio));

function renderVehicleList(){
  const wrap=$('#vehicleList');
  if(!wrap)return;
  wrap.innerHTML='';
  wrap.appendChild(renderVehicleListContent(getFilteredVehicles()));
}

function renderVehicleListContent(list){
  if(list.length===0){
    const empty=el('div',{class:'empty'});
    empty.appendChild(el('div',{class:'empty-icon'},svgIcon('bike','48px')));
    empty.appendChild(el('p',{class:'text-sm font-medium'},'暂无符合条件的车辆'));
    empty.appendChild(el('p',{class:'text-xs text-muted mt-1'},'试试调整筛选条件看看'));
    empty.appendChild(el('button',{class:'btn btn-secondary btn-sm mt-4',onclick:()=>{resetFilter();render();}},'重置筛选'));
    return empty;
  }
  const grid=el('div',{class:'grid grid-2'});
  list.forEach(v=>grid.appendChild(renderVehicleCard(v)));
  return grid;
}

function getFilteredVehicles(){
  const f=state.filter;
  return state.vehicles.filter(v=>{
    if(f.keyword){const kw=f.keyword.toLowerCase();if(!v.brand.toLowerCase().includes(kw)&&!v.model.toLowerCase().includes(kw)&&!(v.description||'').toLowerCase().includes(kw))return false;}
    if(f.brand!=='all'&&v.brand!==f.brand)return false;
    if(f.condition!=='all'&&v.condition!==f.condition)return false;
    if(f.years!=='all'&&v.years!==f.years)return false;
    if(f.voltage!=='all'&&v.voltage!==f.voltage)return false;
    if(f.cert3c!=='all'){if(f.cert3c==='yes'&&!v.has3C)return false;if(f.cert3c==='no'&&v.has3C)return false;}
    if(f.range!=='all'){
      if(f.range==='0-30'&&v.range>30)return false;
      if(f.range==='30-50'&&(v.range<=30||v.range>50))return false;
      if(f.range==='50-80'&&(v.range<=50||v.range>80))return false;
      if(f.range==='80+'&&v.range<=80)return false;
    }
    if(v.price<f.priceMin||v.price>f.priceMax)return false;
    return true;
  });
}

function resetFilter(){
  state.filter={keyword:'',brand:'all',condition:'all',years:'all',range:'all',voltage:'all',cert3c:'all',priceMin:0,priceMax:MAX_PRICE,open:state.filter.open};
}

function renderFilterPanel(){
  const f=state.filter;
  const box=el('div',{class:'filter-box'});
  // 品牌
  box.appendChild(renderFilterTagRow('品牌',['全部',...BRAND_OPTIONS],f.brand,v=>{f.brand=v==='全部'?'all':v;render();}));
  // 成色
  box.appendChild(renderFilterTagRow('成色',['全部',...CONDITION_OPTIONS],f.condition,v=>{f.condition=v==='全部'?'all':v;render();}));
  // 已用年限
  box.appendChild(renderFilterSelect('已用年限',['全部',...YEARS_OPTIONS],f.years,v=>{f.years=v;renderVehicleList();}));
  // 续航
  const rangeOpts=[{v:'all',l:'全部'},{v:'0-30',l:'30km内'},{v:'30-50',l:'30-50km'},{v:'50-80',l:'50-80km'},{v:'80+',l:'80km以上'}];
  box.appendChild(renderFilterSelectObj('续航里程',rangeOpts,f.range,v=>{f.range=v;renderVehicleList();}));
  // 电压
  box.appendChild(renderFilterSelect('电压',['全部',...VOLTAGE_OPTIONS],f.voltage,v=>{f.voltage=v;renderVehicleList();}));
  // 3C
  const c3Opts=[{v:'all',l:'全部'},{v:'yes',l:'有3C认证'},{v:'no',l:'无3C认证'}];
  box.appendChild(renderFilterSelectObj('3C认证',c3Opts,f.cert3c,v=>{f.cert3c=v;renderVehicleList();}));

  btnRow.appendChild(el('button',{class:'btn btn-secondary flex-1',onclick:closeModal},'取消'));
  btnRow.appendChild(el('button',{class:'btn '+(danger?'btn-destructive':'btn-primary')+' flex-1',onclick:()=>{onConfirm();closeModal();render();}},'确认'));
  wrap.appendChild(btnRow);
  showModal(wrap);
}
function showDeleteConfirm(v){showConfirm('确认删除','确定要删除「'+v.brand+' '+v.model+'」吗？此操作不可撤销。',()=>{state.vehicles=state.vehicles.filter(x=>x.id!==v.id);state.favorites=state.favorites.filter(f=>f!==v.id);saveVehicles();saveFavorites();Toast.success('已删除');},true);}
function showClearConfirm(){showConfirm('清空所有数据','此操作将清除所有车辆、商家信息和收藏数据，且不可恢复。确定继续吗？',()=>{state.vehicles=[];state.favorites=[];state.merchant={shopName:'',phone:'',wechat:'',address:'',bio:''};saveVehicles();saveFavorites();saveMerchant();Toast.success('所有数据已清空');},true);}
function showResetConfirm(){showConfirm('重置为示例数据','此操作将覆盖当前所有车辆和商家数据，替换为示例数据。确定继续吗？',()=>{state.vehicles=JSON.parse(JSON.stringify(SAMPLE_VEHICLES));state.merchant={...DEFAULT_MERCHANT};state.favorites=[];saveVehicles();saveMerchant();saveFavorites();Toast.success('已重置为示例数据');},false);}
function showImportConfirm(data){showConfirm('确认导入','导入将覆盖现有车辆和商家数据，确定继续吗？包含 '+(data.vehicles?.length||0)+' 条车辆数据。',()=>{if(data.vehicles){state.vehicles=data.vehicles;saveVehicles();}if(data.merchant){state.merchant=data.merchant;saveMerchant();}Toast.success('导入成功');},false);}

// ========== 修改密码弹窗 ==========
function showPasswordModal(){
  let oldPwd='',newPwd='',confirmPwd='';
  const wrap=el('div',{class:'p-5'});
  wrap.appendChild(el('h3',{class:'text-base font-semibold flex items-center gap-2 mb-4'},[svgIcon('key','20px'),'修改管理密码']));
  const body=el('div',{style:'display:flex;flex-direction:column;gap:12px'});
  const oldInp=el('input',{type:'password',class:'input',placeholder:'请输入旧密码'});oldInp.addEventListener('input',e=>oldPwd=e.target.value);
  const newInp=el('input',{type:'password',class:'input',placeholder:'至少4位'});newInp.addEventListener('input',e=>newPwd=e.target.value);
  const confInp=el('input',{type:'password',class:'input',placeholder:'再次输入新密码'});confInp.addEventListener('input',e=>confirmPwd=e.target.value);
  body.appendChild(el('div',[el('label',{class:'label'},'旧密码'),oldInp]));
  body.appendChild(el('div',[el('label',{class:'label'},'新密码'),newInp]));
  body.appendChild(el('div',[el('label',{class:'label'},'确认新密码'),confInp]));
  wrap.appendChild(body);
  const btnRow=el('div',{class:'flex gap-2 mt-4'});
  btnRow.appendChild(el('button',{class:'btn btn-secondary flex-1',onclick:closeModal},'取消'));
  btnRow.appendChild(el('button',{class:'btn btn-primary flex-1',onclick:()=>{
    if(localStorage.getItem(K.p)!==oldPwd){Toast.error('旧密码错误');return;}
    if(!newPwd||newPwd.length<4){Toast.error('新密码至少4位');return;}
    if(newPwd!==confirmPwd){Toast.error('两次输入的新密码不一致');return;}
    localStorage.setItem(K.p,newPwd);Toast.success('密码修改成功');closeModal();
  }},'确认修改'));
  wrap.appendChild(btnRow);
  showModal(wrap);
}

// ========== 启动 ==========
loadState();
render();
</script>
</body>
